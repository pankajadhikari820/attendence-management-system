<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>SmartAttend — Universal Attendance Management SaaS</title>
    <meta
      name="description"
      content="Universal multi-organization attendance management SaaS for schools, colleges, coaching institutes, offices, startups, and factories. Dynamic hierarchies, secure QR attendance, shifts, leaves, and reports."
    />
    <meta property="og:title" content="SmartAttend — Universal Attendance Management SaaS" />
    <meta
      property="og:description"
      content="Attendance management simplified for every organization with isolated workspaces, custom hierarchies, secure QR codes, and real-time Firebase sync."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/landing.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('smartattend_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="offline-banner" class="offline-banner" role="alert" style="display:none;">
      <strong>You are offline.</strong> Viewing cached interface only — live attendance marking and organization changes require an active internet connection.
    </div>
    <div id="app" class="app-shell">
      <div class="boot-screen">
        <div class="boot-card">
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-title">SmartAttend</p>
          <p class="boot-subtitle">Loading universal attendance platform...</p>
        </div>
      </div>
    </div>
    <div id="modal-root" aria-live="polite"></div>
    <div id="toast-root" class="toast-container" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
